.rail-nowcast {
    background: var(--scrubber-nowcast);
    height: 100%;
    flex: 1;
}
.scrubber-thumb {
    position: absolute;
    top: 50%;
    width: 18px;
    height: 18px;
    border-radius: var(--radius-full);
    background: var(--accent);
    border: 2.5px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3), 0 0 0 4px var(--accent-glow);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 2;
    transition: left var(--transition-base), box-shadow var(--transition-fast), transform var(--transition-fast);
}
.scrubber-thumb.dragging {
    transition: none;
    cursor: grabbing;
    transform: translate(-50%, -50%) scale(1.15);
    box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 0 0 6px var(--accent-glow);
}

/* Now marker (opt-in via config.nowMarker) - wall-clock position indicator */
.now-marker {
    position: absolute;
    top: 50%;
    width: 2px;
    height: 16px;
    border-radius: 1px;
    background: #e53935;
    box-shadow: 0 0 3px rgba(229, 57, 53, 0.6);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1; /* above the rail, below the thumb */
    transition: left var(--transition-slow);
}
/* Current-time label above the now marker (config.nowMarkerLabel) */
.now-marker-label {
    position: absolute;
    bottom: calc(100% + 2px);
    font-size: 9px;
    line-height: 1;
    color: #e53935;
    white-space: nowrap;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 1;
    font-variant-numeric: tabular-nums;
    transition: left var(--transition-slow);
}

/* Tick labels */
.scrubber-ticks {
    display: flex;
    position: relative;
    height: 20px;
    margin-top: 2px;
}
.tick-label {
    font-size: var(--font-size-xs);
    color: var(--text-dim);
    position: absolute;
    transform: translateX(-50%);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: color var(--transition-fast);
}
.tick-label::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    width: 1px;
    height: 4px;
    background: var(--scrubber-rail);
    transform: translateX(-50%);
    transition: background var(--transition-fast);
}
.tick-label.nowcast-tick {
    color: var(--accent);
}
.tick-label.nowcast-tick::before {
    background: var(--accent);
}
.tick-label.active-tick {
    color: var(--accent);
    font-weight: 600;
}
.tick-label.active-tick::before {
    background: var(--accent);
    width: 2px;
    height: 5px;
    border-radius: 1px;
}
.tick-divider {
    position: absolute;
    font-size: var(--font-size-xs);
    color: var(--accent);
    transform: translateX(-50%);
    font-weight: 700;
}
.tick-divider::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    width: 2px;
    height: 5px;
    background: var(--accent);
    transform: translateX(-50%);
    border-radius: 1px;
}

/* Timestamp display */
.timestamp-display {
    font-size: var(--font-size-lg);
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    min-width: 80px;
    text-align: right;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
}
.timestamp-display .forecast-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    margin-left: var(--space-1);
    text-transform: uppercase;
    letter-spacing: 0.03em;
}
.timestamp-display .forecast-label--off {
    visibility: hidden;
}

/* === ALERTS POPUP === */
.lv-alert-popup {
    font-size: 13px;
    line-height: 1.5;
    max-width: 320px;
}
.lv-alert-popup-title {
    margin: 0 0 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--alert-color);
}
.lv-popup-pulse-fast {
    animation: lv-pulse 0.9s ease-in-out infinite;
}
.lv-popup-pulse-slow {
    animation: lv-pulse 1.5s ease-in-out infinite;
}
@keyframes lv-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}
.lv-alert-popup-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}
.lv-alert-severity {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--alert-color);
    color: #fff;
}
.lv-alert-popup-urgency {
    background: #424242;
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
}
.lv-alert-popup-description {
    margin: 6px 0;
    font-size: 12px;
    color: var(--text-secondary);
}
.lv-alert-popup-expires {
    font-size: 11px;
    color: var(--text-dim);
    margin: 4px 0;
}
.lv-alert-popup-hazards {
    margin: 6px 0;
    font-size: 12px;
}
.lv-alert-popup-hazards-label {
    margin: 0 0 5px;
    font-size: 12px;
}
.lv-alert-popup-hazard-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}
.lv-alert-popup-hazard-tag {
    background: #616161;
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
}
.lv-alert-popup-action {
    margin: 10px 0;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    border-left: 3px solid transparent;
}
.lv-alert-popup-action.emergency {
    background: rgba(123, 31, 162, 0.14);
    border-left-color: #7B1FA2;
    color: #d8a6e8;
}
.lv-alert-popup-action.extreme {
    background: rgba(183, 28, 28, 0.14);
    border-left-color: #B71C1C;
    color: #ef9a9a;
}
.lv-alert-popup-action.severe {
    background: rgba(198, 40, 40, 0.14);
    border-left-color: #C62828;
    color: #ef9a9a;
}
.lv-alert-popup-action.moderate {
    background: rgba(239, 108, 0, 0.14);
    border-left-color: #EF6C00;
    color: #ffb74d;
}
.lv-alert-popup-summary {
    cursor: pointer;
    background: #424242;
    color: #fff;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    outline: none;
    margin-top: 8px;
}
.lv-alert-popup-fulltext {
    margin-top: 8px;
    max-height: 200px;
    overflow-y: auto;
    padding: 8px 10px;
    background: #f5f5f5;
    color: #1a1a1a;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.5;
}

/* === ALERT POLYGON ANIMATIONS === */
@keyframes emergency-alert-pulse {
    0%, 100% {
        stroke-opacity: 1;
        fill-opacity: 0.45;
        stroke-width: 3.5px;
    }
    50% {
        stroke-opacity: 1;
        fill-opacity: 0.7;
        stroke-width: 6px;
    }
}
@keyframes extreme-alert-pulse {
    0%, 100% {
        stroke-opacity: 0.9;
        fill-opacity: 0.3;
        stroke-width: 3px;
    }
    50% {
        stroke-opacity: 1;
        fill-opacity: 0.5;
        stroke-width: 5px;
    }
}
@keyframes severe-alert-pulse {
    0%, 100% {
        stroke-opacity: 0.8;
        fill-opacity: 0.25;
        stroke-width: 2.5px;
    }
    50% {
        stroke-opacity: 0.9;
        fill-opacity: 0.35;
        stroke-width: 3.5px;
    }
}
.emergency-alert-polygon {
    animation: emergency-alert-pulse 1s infinite ease-in-out;
}
.extreme-alert-polygon {
    animation: extreme-alert-pulse 2s infinite ease-in-out;
}
.severe-alert-polygon {
    animation: severe-alert-pulse 3s infinite ease-in-out;
}

/* === RESPONSIVE === */
@media (max-width: 600px) {
    .toolbar { padding: var(--space-1) var(--space-2); gap: var(--space-1); }
    .toolbar-title { font-size: var(--font-size-md); }
    .toolbar select,
    .options-panel select { height: 28px; font-size: 11px; padding: 0 var(--space-1); padding-right: 20px; background-position: right 4px center; }
    .icon-btn { height: 28px; min-width: 28px; font-size: 11px; }
    .replayer { padding: var(--space-2) var(--space-2) var(--space-1); }

    .scrubber-track { height: 28px; }
    .scrubber-thumb { width: 16px; height: 16px; }
    .locate-btn { width: 32px; height: 32px; top: var(--space-2); right: var(--space-2); }
    .locate-btn svg { width: 16px; height: 16px; }
    .locate-btn.alerts-btn ~ .locate-btn { top: calc(var(--space-2) + 32px + var(--space-2)); }
    .preload-indicator { top: var(--space-2); left: var(--space-2); }
    .tick-label { font-size: 9px; }
}

/* === REDUCED MOTION === */
@media (prefers-reduced-motion: reduce) {
    .scrubber-thumb,
    .preload-indicator,
    .preload-fill,
    .error-overlay,
    .refresh-status,
    .options-panel,
    .play-btn,
    .icon-btn,
    .locate-btn {
        transition: none !important;
    }
    .play-btn:hover,
    .icon-btn:hover,
    .locate-btn:hover {
        transform: none !important;
    }
    .lv-popup-pulse-fast,
    .lv-popup-pulse-slow,
    .emergency-alert-polygon,
    .extreme-alert-polygon,
    .severe-alert-polygon {
        animation: none;
    }
}

<script>
/* SPDX-License-Identifier: MIT
   Standalone benchmark: compares fetching a radar frame's viewport as many
   individual tile requests vs. one LWXB bundle request, then animates the
   bundle-delivered frames on the map. No shared viewer engine. */
(function () {
    'use strict';

    var LVR_API_FIXED = null; // --site build pins this to the public API base

    var API_SOURCES = {
        local: 'http://localhost:8080',
        public: 'https://api.librewxr.net'
    };
    var COLOR = 10;                 // color scheme (not part of the bundle cache key)
    var TILE_CONCURRENCY = 6;       // parallel fetches, both methods
    var BUNDLE_MAGIC = 0x4258574c;  // 'LWXB' little-endian uint32

    var map = L.map('lv-map', { zoomSnap: 1 }).setView([39.83, -98.58], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    document.getElementById('lv-map').classList.add('lv-basemap-dark');

    var $ = function (id) { return document.getElementById(id); };
    var catalog = null;       // weather-maps.json
    var maxBundleTiles = 256; // from /health, refined below
    var frameLayers = [];     // per-frame L.layerGroup of imageOverlays
    var objectUrls = [];      // tracked for revoke on re-run
    var playTimer = null;
    var playIdx = 0;

    function apiBase() {
        if (LVR_API_FIXED) return LVR_API_FIXED;
        var sel = $('lv-source');
        return API_SOURCES[sel ? sel.value : 'local'] || API_SOURCES.local;
    }

    /* --- slippy tile math --- */
    function lon2tile(lon, z) { return Math.floor((lon + 180) / 360 * Math.pow(2, z)); }
    function lat2tile(lat, z) {
        var r = lat * Math.PI / 180;
        return Math.floor((1 - Math.asinh(Math.tan(r)) / Math.PI) / 2 * Math.pow(2, z));
    }
    function tile2lon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
    function tile2lat(y, z) {
        var n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
        return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    /* Integer-zoom tile rectangle for the current viewport, clamped to the
       world and to maxBundleTiles (shrinks the east/south edge if needed). */
    function viewportRect() {
        var z = Math.round(map.getZoom());
        var b = map.getBounds();
        var n = Math.pow(2, z);
        var x0 = clamp(lon2tile(b.getWest(), z), 0, n - 1);
        var x1 = clamp(lon2tile(b.getEast(), z), 0, n - 1);
        var y0 = clamp(lat2tile(b.getNorth(), z), 0, n - 1);
        var y1 = clamp(lat2tile(b.getSouth(), z), 0, n - 1);
        if (x1 < x0) x1 = x0;
        if (y1 < y0) y1 = y0;
        while ((x1 - x0 + 1) * (y1 - y0 + 1) > maxBundleTiles) {
            if (x1 - x0 >= y1 - y0) x1--; else y1--;
        }
        return { z: z, x0: x0, y0: y0, x1: x1, y1: y1 };
    }

    function opts() {
        return {
            fmt: $('b-format').value,
            size: $('b-size').value,
            ss: ($('b-smooth').checked ? '1' : '0') + '_' + ($('b-snow').checked ? '1' : '0')
        };
    }

    function selectedFrames() {
        var past = (catalog.radar && catalog.radar.past) || [];
        var now = (catalog.radar && catalog.radar.nowcast) || [];
        var all = past.concat(now);
        var pick = $('b-frames').value;
        if (pick === 'all') return all;
        return all.slice(-parseInt(pick, 10));
    }

    function tileUrl(frame, r, o, x, y, cb) {
        return apiBase() + frame.path + '/' + o.size + '/' + r.z + '/' + x + '/' + y +
            '/' + COLOR + '/' + o.ss + '.' + o.fmt + '?cb=' + cb;
    }
    function bundleUrl(frame, r, o, cb) {
        return apiBase() + frame.path + '/bundle/' + o.size + '/' + r.z + '/' +
            r.x0 + '/' + r.y0 + '/' + r.x1 + '/' + r.y1 + '/' + COLOR + '/' + o.ss +
            '.' + o.fmt + '?cb=' + cb;
    }

    /* Run `tasks` (array of () => Promise) with bounded concurrency. */
    function pool(tasks, limit) {
        var i = 0, active = 0, done = 0, results = new Array(tasks.length);
        return new Promise(function (resolve, reject) {
            function next() {
                if (done === tasks.length) return resolve(results);
                while (active < limit && i < tasks.length) {
                    (function (idx) {
                        active++;
                        tasks[idx]().then(function (v) {
                            results[idx] = v; active--; done++; next();
                        }, reject);
                    })(i++);
                }
            }
            next();
        });
    }

    /* --- LWXB bundle unpack --- */
    function unpackBundle(buf, ct) {
        var dv = new DataView(buf);
        if (dv.getUint32(0, true) !== BUNDLE_MAGIC) throw new Error('bad bundle magic');
        var manifestLen = dv.getUint32(8, true);
        var manifest = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 12, manifestLen)));
        var base = 12 + manifestLen;
        var type = manifest.content_type || ct || 'image/png';
        var tiles = manifest.tiles.map(function (t) {
            var blob = new Blob([buf.slice(base + t.o, base + t.o + t.n)], { type: type });
            return { x: t.x, y: t.y, url: URL.createObjectURL(blob) };
        });
        return { manifest: manifest, tiles: tiles };
    }

    /* --- Method A: individual tiles --- */
    function runIndividual(frames, r, o, cb) {
        var tasks = [];
        frames.forEach(function (f) {
            for (var y = r.y0; y <= r.y1; y++) {
                for (var x = r.x0; x <= r.x1; x++) {
                    (function (f, x, y) {
                        tasks.push(function () {
                            return fetch(tileUrl(f, r, o, x, y, cb), { cache: 'no-store' })
                                .then(function (res) { return res.blob(); })
                                .then(function (b) { return b.size; });
                        });
                    })(f, x, y);
                }
            }
        });
        var t0 = performance.now();
        return pool(tasks, TILE_CONCURRENCY).then(function (sizes) {
            var bytes = sizes.reduce(function (a, b) { return a + b; }, 0);
            return { requests: tasks.length, bytes: bytes, ms: performance.now() - t0 };
        });
    }

    /* --- Method B: one bundle per frame --- */
    function runBundle(frames, r, o, cb) {
        var unpacked = new Array(frames.length);
        var tasks = frames.map(function (f, idx) {
            return function () {
                return fetch(bundleUrl(f, r, o, cb), { cache: 'no-store' })
                    .then(function (res) {
                        return res.arrayBuffer().then(function (buf) {
                            unpacked[idx] = unpackBundle(buf, res.headers.get('content-type'));
                            return buf.byteLength;
                        });
                    });
            };
        });
        var t0 = performance.now();
        return pool(tasks, TILE_CONCURRENCY).then(function (lens) {
            var bytes = lens.reduce(function (a, b) { return a + b; }, 0);
            return {
                requests: frames.length, bytes: bytes, ms: performance.now() - t0,
                frames: frames, unpacked: unpacked, rect: r
            };
        });
    }

    /* --- Render bundle-delivered frames as imageOverlays --- */
    function renderFrames(result) {
        stopPlay();
        frameLayers.forEach(function (g) { map.removeLayer(g); });
        frameLayers = [];
        objectUrls.forEach(function (u) { URL.revokeObjectURL(u); });
        objectUrls = [];

        var z = result.rect.z;
        result.unpacked.forEach(function (up) {
            var group = L.layerGroup();
            up.tiles.forEach(function (t) {
                objectUrls.push(t.url);
                var bounds = [
                    [tile2lat(t.y + 1, z), tile2lon(t.x, z)],
                    [tile2lat(t.y, z), tile2lon(t.x + 1, z)]
                ];
                L.imageOverlay(t.url, bounds, { opacity: 0, interactive: false }).addTo(group);
            });
            group.addTo(map);
            frameLayers.push(group);
        });

        playIdx = frameLayers.length - 1;
        showFrame(playIdx, result.frames);
        $('b-play').classList.remove('hidden');
    }

    function setGroupOpacity(group, v) {
        group.eachLayer(function (l) { l.setOpacity(v); });
    }
    function showFrame(idx, frames) {
        frameLayers.forEach(function (g, i) { setGroupOpacity(g, i === idx ? 0.8 : 0); });
        var t = frames[idx] && frames[idx].time;
        $('b-play-label').textContent = t
            ? new Date(t * 1000).toLocaleTimeString() + '  (' + (idx + 1) + '/' + frames.length + ')'
            : (idx + 1) + '/' + frames.length;
    }
    function startPlay(frames) {
        if (frameLayers.length < 2) return;
        $('b-play-btn').textContent = 'Pause';
        playTimer = setInterval(function () {
            playIdx = (playIdx + 1) % frameLayers.length;
            showFrame(playIdx, frames);
        }, 500);
    }
    function stopPlay() {
        if (playTimer) { clearInterval(playTimer); playTimer = null; }
        var btn = $('b-play-btn');
        if (btn) btn.textContent = 'Play';
    }

    /* --- Orchestration --- */
    function fmtKB(bytes) { return (bytes / 1024).toFixed(1); }

    function runBenchmark() {
        if (!catalog) return;
        var frames = selectedFrames();
        if (!frames.length) { $('b-status').textContent = 'No frames in catalog.'; return; }
        var r = viewportRect();
        var o = opts();
        var tilesPerFrame = (r.x1 - r.x0 + 1) * (r.y1 - r.y0 + 1);
        var cb = Math.random().toString(36).slice(2);

        $('b-run').disabled = true;
        $('b-results').hidden = true;
        $('b-status').textContent = 'Zoom ' + r.z + ', ' + tilesPerFrame + ' tiles/frame x ' +
            frames.length + ' frames. Fetching individually…';

        runIndividual(frames, r, o, cb + 'a').then(function (a) {
            $('b-status').textContent = 'Individual done in ' + a.ms.toFixed(0) +
                ' ms. Fetching as bundles…';
            return runBundle(frames, r, o, cb + 'b').then(function (b) {
                $('r-a-req').textContent = a.requests;
                $('r-a-kb').textContent = fmtKB(a.bytes);
                $('r-a-ms').textContent = a.ms.toFixed(0);
                $('r-b-req').textContent = b.requests;
                $('r-b-kb').textContent = fmtKB(b.bytes);
                $('r-b-ms').textContent = b.ms.toFixed(0);
                var speed = (a.ms / b.ms);
                $('b-verdict').textContent = 'Bundle: ' + speed.toFixed(1) + '× faster wall time, ' +
                    (a.requests - b.requests) + ' fewer requests.';
                $('b-results').hidden = false;
                $('b-status').textContent = 'Rendering bundle frames…';
                renderFrames(b);
                $('b-status').textContent = 'Done. Press Play to animate.';
                $('b-run').disabled = false;
            });
        }).catch(function (e) {
            $('b-status').textContent = 'Error: ' + e.message;
            $('b-run').disabled = false;
        });
    }

    function loadCatalog() {
        $('b-status').textContent = 'Loading catalog…';
        fetch(apiBase() + '/public/weather-maps.json', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                catalog = data;
                return fetch(apiBase() + '/health', { cache: 'no-store' })
                    .then(function (r) { return r.json(); })
                    .then(function (h) {
                        if (h && h.tile_bundles && h.tile_bundles.max_tiles) {
                            maxBundleTiles = h.tile_bundles.max_tiles;
                        }
                    }, function () {});
            })
            .then(function () {
                var past = (catalog.radar && catalog.radar.past) || [];
                var now = (catalog.radar && catalog.radar.nowcast) || [];
                $('b-status').textContent = past.length + ' past + ' + now.length +
                    ' nowcast frames. Pan/zoom, then Run benchmark.';
            })
            .catch(function (e) {
                $('b-status').textContent = 'Catalog load failed: ' + e.message;
            });
    }

    $('b-run').addEventListener('click', runBenchmark);
    $('b-play-btn').addEventListener('click', function () {
        if (playTimer) stopPlay();
        else startPlay(selectedFrames());
    });
    var srcSel = $('lv-source');
    if (srcSel) {
        var loc = window.location;
        srcSel.value = (loc.protocol === 'file:' || loc.hostname === 'localhost' ||
            loc.hostname === '127.0.0.1') ? 'local' : 'public';
        srcSel.addEventListener('change', loadCatalog);
    }
    loadCatalog();
})();
</script>
</body>
